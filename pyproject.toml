[project]
name = "caqrs"
version = "0.0.1"
description = "Constrained Agentic Quant Research System — LLM-based financial research orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "niraiarin" }]
keywords = ["agentic", "llm", "quant", "research", "trading"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Parquet reader for caqrs.data.polymarket_archive (hourly snapshots from
# archive.pmxt.dev). Install with: pip install caqrs[archive] or
# uv add --optional archive caqrs[archive].
archive = ["polars>=1.0,<2"]

# FastAPI + ASGI server for caqrs.api (auto-generated OpenAPI docs over
# the existing Pydantic schemas). Install with: pip install caqrs[api]
# or uv add --optional api caqrs[api]. Run with:
#   uvicorn caqrs.api.app:app --reload
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

# yfinance wrapper for caqrs.data.yfinance (Yahoo Finance daily bars +
# financials). Install with: pip install caqrs[yfinance]. yfinance pulls
# pandas + numpy as transitive deps. Production pitfalls (rate limits,
# field-name drift, NaN handling, cache contention) are encoded in the
# CAQRS wrapper — see docstrings in caqrs.data.yfinance.client.
yfinance = ["yfinance>=0.2.40,<1"]

# DuckDB-backed persistent EntityStore. Install with: pip install
# caqrs[entities].
entities = ["duckdb>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/niraiarin/caqrs"
Issues = "https://github.com/niraiarin/caqrs/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caqrs"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "respx>=0.21",
    # The archive adapter's unit + live tests need polars; keep it in dev
    # so `uv sync` pulls it in even without --extra archive.
    "polars>=1.0,<2",
    # FastAPI + httpx-based TestClient for caqrs.api tests; keep in dev
    # so `uv sync` pulls it in without --extra api.
    "fastapi>=0.115,<1",
    # yfinance unit tests need pandas (for the mock DataFrames) + the
    # yfinance lib itself. Pin in dev so `uv sync` pulls them without
    # --extra yfinance.
    "yfinance>=0.2.40,<1",
    # Persistent EntityStore tests need DuckDB in dev without --extra entities.
    "duckdb>=1.0,<2",
]

# === ruff ===

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
    "PT",           # flake8-pytest-style
    "TID",          # tidy-imports
    "ARG",          # unused-arguments
    "ANN",          # annotations
    "A",            # builtins
    "C4",           # comprehensions
    "ICN",          # import-conventions
    "ERA",          # eradicate (commented-out code)
    "PL",           # pylint subset
    "PERF",         # perflint
]
ignore = [
    "ANN401",  # Allow Any in narrow cases
    "PLR0913", # too-many-arguments — pydantic models often have many fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "PLR2004", "PT011"]

[tool.ruff.format]
quote-style = "double"

# === mypy ===

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# pandas / yfinance lack first-class type stubs (pandas-stubs is a
# separate package, yfinance has no py.typed marker). Opt out of
# import checking for these two; CAQRS uses them only at narrow
# boundaries and the data crossing into Pydantic schemas is fully
# typed.
[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yfinance"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# === pytest ===

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
markers = [
    "live: requires a real LLM endpoint, gated by CAQRS_LIVE=1",
    "traces(req_id): link this test to one or more REQ-IDs in docs/requirements/registry.yaml. Example: @pytest.mark.traces('ENT-A1')",
]
filterwarnings = [
    "error",
    # pytest-asyncio + httpx leaves selector sockets / event loops dangling
    # at GC time. The actual tests close their own clients via async-with;
    # this is a cleanup-order quirk, not a real leak.
    "ignore:unclosed.*:ResourceWarning",
    "ignore:Exception ignored.*:pytest.PytestUnraisableExceptionWarning",
]

# === coverage ===

[tool.coverage.run]
branch = true
source = ["src/caqrs"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
