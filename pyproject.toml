[project]
name = "caqrs"
version = "0.0.1"
description = "Constrained Agentic Quant Research System — LLM-based financial research orchestrator"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "niraiarin" }]
keywords = ["agentic", "llm", "quant", "research", "trading"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/niraiarin/caqrs"
Issues = "https://github.com/niraiarin/caqrs/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caqrs"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "respx>=0.21",
]

# === ruff ===

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
    "PT",           # flake8-pytest-style
    "TID",          # tidy-imports
    "ARG",          # unused-arguments
    "ANN",          # annotations
    "A",            # builtins
    "C4",           # comprehensions
    "ICN",          # import-conventions
    "ERA",          # eradicate (commented-out code)
    "PL",           # pylint subset
    "PERF",         # perflint
]
ignore = [
    "ANN401",  # Allow Any in narrow cases
    "PLR0913", # too-many-arguments — pydantic models often have many fields
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "ARG", "PLR2004", "PT011"]

[tool.ruff.format]
quote-style = "double"

# === mypy ===

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# === pytest ===

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # pytest-asyncio + httpx leaves selector sockets / event loops dangling
    # at GC time. The actual tests close their own clients via async-with;
    # this is a cleanup-order quirk, not a real leak.
    "ignore:unclosed.*:ResourceWarning",
    "ignore:Exception ignored.*:pytest.PytestUnraisableExceptionWarning",
]

# === coverage ===

[tool.coverage.run]
branch = true
source = ["src/caqrs"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
