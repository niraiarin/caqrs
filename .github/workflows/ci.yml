name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Check requirement traceability
        run: uv run --with pyyaml python scripts/check_traceability.py

      - name: Check data-source TOS coverage
        run: python scripts/check_data_source_tos.py

      - name: Check credential isolation (NFR-LIVE-BROKER-2)
        run: uv run --frozen python scripts/check_credential_isolation.py

      - name: Test
        run: uv run pytest --cov=caqrs --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
        if: always()

  # Performance smoke benchmarks (NFR-PERF-1, NFR-PERF-3). Task #89 lands
  # this as a separate, non-blocking job: `continue-on-error: true` keeps
  # CI green while we collect ~1 week of stable baselines on the GitHub
  # runner before we promote it to a blocking gate. Runs only after the
  # main `test` matrix passes, so a real bug fails the blocking job first.
  perf:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen

      - name: Run perf benchmarks
        run: uv run --frozen pytest -m perf --benchmark-only --benchmark-disable-gc
