# Traceability registry for caqrs requirements.
#
# This is the single source of truth that maps stable REQ-IDs to:
#   - the spec section that defines them,
#   - the Pydantic types that encode them,
#   - the tests that exercise them,
#   - and the formalization status (formalized / partial / tacit / deferred).
#
# Conventions:
#   * functional REQ-IDs are prefixed by subsystem (ENT-*, GW-*, BROKER-*, ...).
#   * non-functional REQ-IDs are prefixed NFR-<CATEGORY>-N (placeholders for #79).
#   * `status: formalized` requires a concrete spec, types, and tests.
#   * `tacit` means the contract is implicit in code/commit messages without a
#     dedicated spec section. These are first-class candidates for promotion to
#     formalized via a future ADR or spec amendment.
#   * `partial` typically means: tests + types are in place, but the
#     "spec" is a module docstring rather than a doc/markdown file or
#     ADR. Promote to `formalized` by adding the missing spec section.
#
# Future tasks build on this file:
#   #79 -- non-functional catalogue (fills measurable thresholds for NFR-* rows).
#   #80 -- @traces pytest marker + CI registry consistency check.
#   #89 -- perf bench harness (turns NFR-PERF-* placeholders into gates).

